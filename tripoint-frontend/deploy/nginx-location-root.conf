# Included by /etc/nginx/sites-available/tripoint (see deploy.sh / auto_deploy).
# Git pull updates this file; nginx reload picks up changes without editing sites-available.

# 301 redirects for retired area pages (Step 1 of area consolidation)
rewrite ^/areas-covered/bromley(/.*)?$         /areas-covered          permanent;
rewrite ^/areas-covered/lewisham(/.*)?$        /areas-covered          permanent;
rewrite ^/areas-covered/dartford(/.*)?$        /areas-covered          permanent;
rewrite ^/areas-covered/eltham(/.*)?$          /areas-covered          permanent;
rewrite ^/areas-covered/sevenoaks(/.*)?$       /areas-covered          permanent;
rewrite ^/areas-covered/tunbridge-wells(/.*)?$ /areas-covered          permanent;
rewrite ^/areas-covered/gravesend(/.*)?$       /areas-covered          permanent;
rewrite ^/areas-covered/sidcup(/.*)?$          /areas-covered/bexley   permanent;

# Remove trailing slash (except root)
rewrite ^/(.+)/$ /$1 permanent;

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /images/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    try_files $uri $uri/index.html $uri.html =404;
    
    # Cache control for HTML (no cache)
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.stripe.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com; frame-src 'self' https://js.stripe.com;" always;
}

error_page 404 /404.html;

