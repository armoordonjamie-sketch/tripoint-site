# Included by /etc/nginx/sites-available/tripoint (see deploy.sh / auto_deploy).
# Git pull updates this file; nginx reload picks up changes without editing sites-available.

# 301 redirects for retired area pages (Step 1 of area consolidation)
rewrite ^/areas-covered/bromley(/.*)?$         /areas-covered          permanent;
rewrite ^/areas-covered/lewisham(/.*)?$        /areas-covered          permanent;
rewrite ^/areas-covered/dartford(/.*)?$        /areas-covered          permanent;
rewrite ^/areas-covered/eltham(/.*)?$          /areas-covered          permanent;
rewrite ^/areas-covered/sevenoaks(/.*)?$       /areas-covered          permanent;
rewrite ^/areas-covered/tunbridge-wells(/.*)?$ /areas-covered          permanent;
rewrite ^/areas-covered/gravesend(/.*)?$       /areas-covered          permanent;
rewrite ^/areas-covered/sidcup(/.*)?$          /areas-covered/bexley   permanent;

# Remove trailing slash (except root)
rewrite ^/(.+)/$ /$1 permanent;

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /images/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    try_files $uri $uri/index.html $uri.html =404;
    
    # Cache control for HTML (no cache)
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://api.stripe.com; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com; script-src-elem 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.google-analytics.com https://analytics.google.com https://www.google.com https://www.google.co.uk https://stats.g.doubleclick.net https://googleads.g.doubleclick.net https://www.googleadservices.com https://b.stripe.com https://m.stripe.com https://q.stripe.com https://a.basemaps.cartocdn.com https://b.basemaps.cartocdn.com https://c.basemaps.cartocdn.com https://d.basemaps.cartocdn.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://region1.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://www.google.com https://www.google.co.uk https://googleads.g.doubleclick.net https://www.googleadservices.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://www.googletagmanager.com https://td.doubleclick.net; upgrade-insecure-requests;" always;
}

error_page 404 /404.html;

