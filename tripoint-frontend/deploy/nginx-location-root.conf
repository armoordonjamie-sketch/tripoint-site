# Included by /etc/nginx/sites-available/tripoint (see deploy.sh / auto_deploy).
# Git pull updates this file; nginx reload picks up changes without editing sites-available.

# 301 redirects for retired area pages (Step 1 of area consolidation)
rewrite ^/areas-covered/bromley(/.*)?$       /areas-covered  301;
rewrite ^/areas-covered/lewisham(/.*)?$      /areas-covered  301;
rewrite ^/areas-covered/dartford(/.*)?$      /areas-covered  301;
rewrite ^/areas-covered/eltham(/.*)?$        /areas-covered  301;
rewrite ^/areas-covered/sevenoaks(/.*)?$     /areas-covered  301;
rewrite ^/areas-covered/tunbridge-wells(/.*)?$ /areas-covered 301;
rewrite ^/areas-covered/gravesend(/.*)?$     /areas-covered  301;
rewrite ^/areas-covered/sidcup(/.*)?$        /areas-covered/bexley 301;

location / {
    try_files $uri $uri/index.html $uri.html /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
