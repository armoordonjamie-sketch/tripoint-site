# Redirect www.tripointdiagnostics.co.uk to tripointdiagnostics.co.uk
# To be included in /etc/nginx/sites-available/tripoint

server {
    listen 80;
    listen [::]:80;
    server_name www.tripointdiagnostics.co.uk;
    return 301 https://tripointdiagnostics.co.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tripointdiagnostics.co.uk;
    
    # SSL certs are managed by certbot on the server
    # ssl_certificate /etc/letsencrypt/live/tripointdiagnostics.co.uk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tripointdiagnostics.co.uk/privkey.pem;

    return 301 https://tripointdiagnostics.co.uk$request_uri;
}
