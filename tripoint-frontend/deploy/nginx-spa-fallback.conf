# TriPoint — SPA + prerender routing for Nginx (VPS).
#
# Source of truth for the `location /` rules lives in:
#   nginx-location-root.conf
#
# Preferred setup (used by deploy.sh and auto_deploy after migration):
#   inside each `server { ... }` that serves the app:
#     include /var/www/tripoint/tripoint-frontend/deploy/nginx-location-root.conf;
#
# Manual one-off: copy the contents of nginx-location-root.conf into server { }.
