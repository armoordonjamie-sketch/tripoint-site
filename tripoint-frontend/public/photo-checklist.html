<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriPoint Photo Shot List</title>
    <style>
        :root {
            --brand: #0ea5e9;
            --brand-light: #38bdf8;
            --surface: #0f172a;
            --surface-alt: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--surface);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 1rem;
            margin: 0;
            padding-bottom: 4rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--brand-light);
        }

        p.intro {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .category {
            background-color: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .category h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px dashed var(--border);
        }

        .item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .checkbox-wrapper {
            padding-top: 0.2rem;
        }

        input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: var(--brand);
            cursor: pointer;
        }

        .content {
            flex: 1;
        }

        .title {
            font-weight: 600;
            display: block;
            margin-bottom: 0.25rem;
        }

        .desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: block;
        }

        .tag {
            display: inline-block;
            background-color: rgba(14, 165, 233, 0.15);
            color: var(--brand-light);
            border: 1px solid rgba(14, 165, 233, 0.3);
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 0.25rem;
            margin-right: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag.hero {
            background-color: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .filename {
            display: inline-flex;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background-color: rgba(0,0,0,0.2);
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            margin-top: 0.4rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Strikethrough for checked items */
        .item.checked .content {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface-alt);
            border-top: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .reset-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .reset-btn:hover {
            color: white;
            border-color: white;
        }
    </style>
</head>
<body>

    <div class="progress-bar">
        <span id="progress-text">0 / 63 Completed</span>
        <button class="reset-btn" onclick="resetChecklist()">Reset All</button>
    </div>

    <script>

                    { id: "cb-2", type: "Gallery", title: "Citan Pads", desc: "Old vs new Citan brake pads.", filename: "citan-brakes-01.jpg" },

                shots: [
                    { id: "cs-1", type: "Hero", title: "Citan Engine (Wide)", desc: "Citan engine bay open, tools ready.", filename: "citan-servicing-hero.jpg" },

                    { id: "hub-2", type: "Gallery", title: "Tool Layout", desc: "Toolbox / kit laid out beside van - shows professionalism.", filename: "merc-van-servicing-01.jpg" },

                ]

                    { id: "eco-2", type: "Gallery", title: "MPG Dash", desc: "Dashboard showing MPG / trip computer reading.", filename: "van-economy-01.jpg" },

                shots: [
                    { id: "fleet-1", type: "Hero", title: "Multiple Vans (Wide)", desc: "Multiple vans parked together at a depot or yard. 2-3+ Mercedes vans in frame.", filename: "fleet-tuning-hero.jpg" },
                    { id: "fleet-2", type: "Gallery", title: "Fleet Lineup", desc: "Row of fleet vans - depot yard with multiple vehicles.", filename: "fleet-tuning-01.jpg" },
                    { id: "fleet-3", type: "Gallery", title: "OBD Queue", desc: "Laptop connected to one van, another van queued behind.", filename: "fleet-tuning-02.jpg" },
                    { id: "fleet-4", type: "Gallery", title: "Multi-Report", desc: "Per-vehicle report on laptop screen.", filename: "fleet-tuning-03.jpg" },
                    { id: "fleet-5", type: "Gallery", title: "Walking with Tools", desc: "Moving between vans - walking with laptop/tools.", filename: "fleet-tuning-04.jpg" },
                    { id: "fleet-6", type: "Gallery", title: "Batch Cable Setup", desc: "Multiple OBD cables/tools laid out for batch work.", filename: "fleet-tuning-05.jpg" },
                    { id: "fleet-7", type: "Gallery", title: "Fleet Manager", desc: "Fleet manager handover - clipboard/tablet with reports.", filename: "fleet-tuning-06.jpg" }
                ]
            }
        ];

        const container = document.getElementById('checklist-container');
        const progressText = document.getElementById('progress-text');
        
        let totalItems = 0;
        let checkedItems = 0;

        // Load saved state from localStorage
        const savedState = JSON.parse(localStorage.getItem('tripoint-shots')) || {};

        function updateProgress() {
            checkedItems = document.querySelectorAll('input[type="checkbox"]:checked').length;
            progressText.textContent = `${checkedItems} / ${totalItems} Completed`;
            localStorage.setItem('tripoint-shots', JSON.stringify(savedState));
        }

        function toggleItem(id, itemDiv) {
            const checkbox = document.getElementById(id);
            if (checkbox.checked) {
                itemDiv.classList.add('checked');
                savedState[id] = true;
            } else {
                itemDiv.classList.remove('checked');
                savedState[id] = false;
            }
            updateProgress();
        }

        function renderChecklist() {
            container.innerHTML = '';
            
            shotList.forEach(category => {
                const catDiv = document.createElement('div');
                catDiv.className = 'category';
                catDiv.innerHTML = `<h2>${category.page}</h2>`;

                category.shots.forEach(shot => {
                    totalItems++;
                    const isChecked = savedState[shot.id] === true;
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `item ${isChecked ? 'checked' : ''}`;
                    
                    const tagClass = shot.type.toLowerCase() === 'hero' ? 'tag hero' : 'tag';

                    itemDiv.innerHTML = `
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="${shot.id}" ${isChecked ? 'checked' : ''}>
                        </div>
                        <label class="content" for="${shot.id}">
                            <span class="title"><span class="${tagClass}">${shot.type}</span>${shot.title}</span>
                            <span class="desc">${shot.desc}</span>
                            ${shot.filename ? `<span class="filename">💾 ${shot.filename}</span>` : ''}
                        </label>
                    `;
                    
                    const checkbox = itemDiv.querySelector('input');
                    checkbox.addEventListener('change', () => toggleItem(shot.id, itemDiv));
                    
                    catDiv.appendChild(itemDiv);
                });

                container.appendChild(catDiv);
            });
            
            updateProgress();
        }

        function resetChecklist() {
            if (confirm("Are you sure you want to reset all progress?")) {
                for (let key in savedState) delete savedState[key];
                renderChecklist();
            }
        }

        // Initialize
        renderChecklist();
    </script>
</body>
</html>
