# TriPoint Diagnostics - Google Setup Configuration
# Copy to config.yaml and fill in your IDs.

google_ads:
  customer_id: "123-456-7890"          # Your Google Ads customer ID
  login_customer_id: ""                 # MCC manager ID (leave blank if not using MCC)

ga4:
  property_id: "123456789"              # GA4 property ID (numbers only)
  measurement_id: "G-XXXXXXXXXX"       # Admin -> Data streams -> Web (same as VITE_GA4_MEASUREMENT_ID)

site:
  domain: "tripointdiagnostics.co.uk"
  timezone: "Europe/London"

# Events to mark as Key Events in GA4 (match tripoint-frontend/src/lib/analytics.ts)
ga4_key_events:
  - submit_contact_form
  - submit_booking_request
  - confirm_booking
  - payment_completed
  - click_whatsapp
  - booking_availability_ok
  - booking_slot_selected

# Google Ads conversion actions to create
google_ads_conversions:
  - name: "TPD - Contact Form Submit"
    event_name: submit_contact_form
    category: LEAD
    type: WEBPAGE
    counting_type: ONE_PER_CLICK
    primary: true

  - name: "TPD - Booking Confirmed"
    event_name: confirm_booking
    category: PURCHASE
    type: WEBPAGE
    counting_type: ONE_PER_CLICK
    primary: true

  - name: "TPD - Phone Call Lead"
    event_name: click_phone_header
    category: LEAD
    type: WEBPAGE
    counting_type: ONE_PER_CLICK
    primary: false

  - name: "TPD - Job Paid (Offline)"
    event_name: null
    category: PURCHASE
    type: UPLOAD_CLICKS
    counting_type: ONE_PER_CLICK
    primary: true
    default_value: 0.0
    variable_value: true
